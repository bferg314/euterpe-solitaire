<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Baize Gradient -->
    <radialGradient id="cardBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#144a36" />
      <stop offset="60%" stop-color="#0a2a1e" />
      <stop offset="100%" stop-color="#04120d" />
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92620c" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Spade -->
    <filter id="spadeShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#cardBg)" stroke="url(#goldFoil)" stroke-width="2.5" />

  <!-- Inner Filigree Border -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="10.5" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.65" />

  <!-- Corner Diamonds -->
  <polygon points="10,9 11.5,10.5 10,12 8.5,10.5" fill="url(#goldFoil)" />
  <polygon points="54,9 55.5,10.5 54,12 52.5,10.5" fill="url(#goldFoil)" />
  <polygon points="10,53 11.5,54.5 10,56 8.5,54.5" fill="url(#goldFoil)" />
  <polygon points="54,53 55.5,54.5 54,56 52.5,54.5" fill="url(#goldFoil)" />

  <!-- Euterpe Crown Motif atop Spade -->
  <path d="M26,19 L32,15 L38,19 L35,21 L32,19.5 L29,21 Z" fill="url(#goldFoil)" opacity="0.9" />
  <circle cx="26" cy="18" r="0.9" fill="#fff1b8" />
  <circle cx="32" cy="14" r="1.1" fill="#fff1b8" />
  <circle cx="38" cy="18" r="0.9" fill="#fff1b8" />

  <!-- Golden Spade Icon with Musical Lyre curves -->
  <g filter="url(#spadeShadow)">
    <path d="M32,20
             C30.5,23.5 24,29 20,33.5
             C16.5,37.5 16,42 19,45
             C22,48 26.5,47.5 29.5,43
             C30.5,41.5 31,39.5 31.2,38.5
             L30.5,48.5
             C27.5,49.2 24,50.2 24,51
             L40,51
             C40,50.2 36.5,49.2 33.5,48.5
             L32.8,38.5
             C33,39.5 33.5,41.5 34.5,43
             C37.5,47.5 42,48 45,45
             C48,42 47.5,37.5 44,33.5
             C40,29 33.5,23.5 32,20 Z"
          fill="url(#goldFoil)" />
    
    <!-- Inner Lyre / Heart Cutout Detail -->
    <path d="M32,25.5
             C31.2,28.5 27,33 24.5,36
             C22.5,38.5 22.5,41 24.5,42.5
             C26.5,44 29,42.5 30.5,39.5
             L31,37
             L33,37
             L33.5,39.5
             C35,42.5 37.5,44 39.5,42.5
             C41.5,41 41.5,38.5 39.5,36
             C37,33 32.8,28.5 32,25.5 Z"
          fill="#0a2a1e" opacity="0.8" />
  </g>

  <!-- Central Star Sparkle -->
  <polygon points="32,32 33.2,34.5 36,35 33.5,36.5 34,39 32,37.5 30,39 30.5,36.5 28,35 30.8,34.5" fill="#fff1b8" />
</svg>